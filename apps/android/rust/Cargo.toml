[package]
name = "fleetinggleam-android"
description = "FleetingGleam 核心库的 Android 绑定：UniFFI 暴露给 Kotlin 的接口，cargo-ndk 编成 libfg_android.so。"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
name = "fg_android"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
fleetinggleam-core.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
base64 = "0.22"
uniffi = { version = "0.32", features = ["cli"] }

# 只在手机上打开 qnn：高通手机上 CLIP 跑在 NPU（HTP）上；ONNX Runtime 改成运行时加载，带 QNN 的 libonnxruntime.so 由 Gradle 从微软的 AAR
# 打进应用。在 Mac 上跑这个 crate 的单元测试时仍是静态链接的 ONNX Runtime
[target.'cfg(target_os = "android")'.dependencies]
fleetinggleam-core = { workspace = true, features = ["qnn"] }
