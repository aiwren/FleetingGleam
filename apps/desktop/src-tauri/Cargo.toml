[package]
name = "fleetinggleam"
description = "FleetingGleam：在本机运行的照片筛选软件（macOS 桌面端，Tauri）"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fleetinggleam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 全部核心逻辑（分析、决策、喜好、搜索、NAS、备份……）在共用的库里；这里只剩 Tauri 命令、窗口与 macOS 的边车
fleetinggleam-core.workspace = true
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 同一时间只开一个惊鸿（第二次打开只是把已有的窗口叫到前面）：两个进程共用数据目录会把分析缓存写乱（审查第 45 条）
tauri-plugin-single-instance = "2"
# 记住窗口的大小、位置、是否最大化 / 全屏，下次打开原样回来
tauri-plugin-window-state = "2"
image.workspace = true
rayon.workspace = true
walkdir.workspace = true
serde.workspace = true
serde_json.workspace = true
kamadak-exif.workspace = true
# 系统废纸篓（照片的淘汰）
trash = "5.2.9"
# 基准测试里直接用 ONNX Runtime 对比 GPU 编码器
ort.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# 访达挂载的网络卷（statfs）
libc.workspace = true
# 放进废纸篓时拿回它在废纸篓里的确切位置（撤销"移到废纸篓"时按它放回原处）；`trash` 用的就是同一版
objc2-foundation = "0.3"
