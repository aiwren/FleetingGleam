[package]
name = "fleetinggleam"
version = "0.1.0"
description = "FleetingGleam：在本机运行的照片筛选软件"
authors = ["FleetingGleam contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/lcopilot/FleetingGleam"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fleetinggleam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.13", features = ["coreml"] }
kamadak-exif = "0.6.1"
fast_image_resize = "6.1.0"
trash = "5.2.9"
aes-gcm = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"


# Debug builds of image decoding and pixel loops are 10-50x slower; optimise them even in `tauri dev`.
[profile.dev]
opt-level = 2
# Incremental builds at opt-level 2 keep ending in "_anon.*.llvm symbol(s) not found" link errors whenever a rebuild is interrupted by the
# next file save; a full rebuild of this crate is only a little slower and never breaks.
incremental = false

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
debug = false
overflow-checks = false

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
