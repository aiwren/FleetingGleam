# 发布：只在推送形如 v0.1.0 的版本标签时运行，构建 macOS 安装包并创建 GitHub Release（草稿）。
# 日常提交不会触发它。发布步骤见 docs/RELEASING.md。
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# 创建 Release、上传安装包需要写权限，仅此工作流使用
permissions:
  contents: write

jobs:
  macos:
    name: macOS（${{ matrix.label }}）
    strategy:
      fail-fast: false
      matrix:
        # 暂时只有 Apple Silicon：ONNX Runtime（ort 2.0.0-rc.13）没有 x86_64 macOS 的预编译库，Intel 版要从源码编译它
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, label: Apple Silicon }
    runs-on: ${{ matrix.runner }}
    # macOS runner 按 10 倍计费；一次正常构建约 15 分钟，挂死的任务不该烧满默认的 6 小时
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与三处版本号一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          for v in "$app" "$pkg" "$crate"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 与版本号不一致：tauri.conf.json=$app package.json=$pkg Cargo.toml=$crate。请先把三处改成同一个版本再打标签。"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 由 Swift 源码构建 Apple Vision / ImageIO 辅助程序（编译产物不进仓库）
      - name: 构建 macOS 辅助程序
        run: sh apps/desktop/scripts/build-vision.sh

      # 去掉编译产物里的本机路径（与 scripts/release.sh 一致）
      - name: 设置 RUSTFLAGS
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"

      # Apple 签名与公证是可选配置：没有设置对应的 Secret 时就跳过，构建仍会成功，只是得到未签名的安装包。
      - name: 读取可选的签名配置
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done
          [ -z "$APPLE_CERTIFICATE" ] && echo "::warning::未设置 Apple 签名证书：这个安装包是 ad-hoc 签名、未经公证，首次打开前用户需要执行 xattr -cr（见 Release 说明）。"
          exit 0

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: FleetingGleam ${{ github.ref_name }}
          releaseBody: |
            ## 安装 / Install

            需要 Apple Silicon（M 系列芯片）的 Mac，macOS 15 及以上。Intel Mac 暂不支持。
            Requires a Mac with Apple Silicon (M-series) and macOS 15 or later. Intel Macs are not supported yet.

            1. 下载 `.dmg`，把 FleetingGleam 拖进“应用程序”。 / Download the `.dmg` and drag FleetingGleam into Applications.
            2. 这个版本没有经过苹果公证。第一次打开前，在“终端”里执行一次： / This build is not notarised by Apple. Before opening it for the first time, run this once in Terminal:

               ```
               xattr -cr /Applications/FleetingGleam.app
               ```

            照片只在本机处理；应用只会联网下载模型文件。 / Your photos stay on your Mac; the app only goes online to download model files.

            更新内容 / What's new: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          # 先作为草稿，维护者检查安装包后再手动发布
          releaseDraft: true
          # 没有自动更新功能：不生成 .app.tar.gz 与 latest.json，Release 里只有 .dmg，用户不会下错
          includeUpdaterJson: false
          prerelease: ${{ contains(github.ref_name, '-') }}
