# 发布：只在推送形如 v0.1.0 的版本标签时运行，构建 macOS 安装包与安卓安装包，放进同一个 GitHub Release（草稿）。
# 日常提交不会触发它。发布步骤见 docs/RELEASING.md。
# 也可以在 Actions 页手动运行（workflow_dispatch）：那样只编安卓包、用正式密钥签名，作为工作流产物留下，不碰任何 Release，用来检查签名配置。
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# 创建 Release、上传安装包需要写权限，仅此工作流使用
permissions:
  contents: write

jobs:
  macos:
    name: macOS（${{ matrix.label }}）
    strategy:
      fail-fast: false
      matrix:
        # 暂时只有 Apple Silicon：ONNX Runtime（ort 2.0.0-rc.13）没有 x86_64 macOS 的预编译库，Intel 版要从源码编译它
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, label: Apple Silicon }
    runs-on: ${{ matrix.runner }}
    # 手动运行只为检查安卓签名，不编 Mac 包
    if: github.event_name == 'push'
    # macOS runner 按 10 倍计费；一次正常构建约 15 分钟，挂死的任务不该烧满默认的 6 小时
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 版本号写在三处：tauri.conf.json、apps/desktop/package.json、根 Cargo.toml 的 [workspace.package]（核心库与 Android 绑定 crate 继承它）。
      # Android 的 versionName 由 Gradle 从根 Cargo.toml 读，这里确认它没有被改回写死的值。
      - name: 校验标签与各处版本号一致（含 Android）
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for v in "$app" "$pkg" "$crate"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 与版本号不一致：tauri.conf.json=$app package.json=$pkg Cargo.toml=$crate。请先把三处改成同一个版本再打标签。"
              exit 1
            fi
          done
          if ! grep -q '^ *versionName = appVersion$' apps/android/app/build.gradle.kts; then
            echo "::error::apps/android/app/build.gradle.kts 的 versionName 不是取自根 Cargo.toml（appVersion）：Android 的版本号会和标签对不上。"
            exit 1
          fi
          for c in packages/core/Cargo.toml apps/desktop/src-tauri/Cargo.toml apps/android/rust/Cargo.toml; do
            if ! grep -q '^version.workspace = true$' "$c"; then
              echo "::error::$c 没有继承工作区的版本号（version.workspace = true）。"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 由 Swift 源码构建 Apple Vision / ImageIO 辅助程序（编译产物不进仓库）
      - name: 构建 macOS 辅助程序
        run: sh apps/desktop/scripts/build-vision.sh

      # 去掉编译产物里的本机路径（与 scripts/release.sh 一致）
      - name: 设置 RUSTFLAGS
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"

      # Apple 签名与公证是可选配置：没有设置对应的 Secret 时就跳过，构建仍会成功，只是得到未签名的安装包。
      - name: 读取可选的签名配置
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done
          [ -z "$APPLE_CERTIFICATE" ] && echo "::warning::未设置 Apple 签名证书：这个安装包是 ad-hoc 签名、未经公证，首次打开前用户需要执行 xattr -cr（见 Release 说明）。"
          exit 0

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: FleetingGleam ${{ github.ref_name }}
          releaseBody: |
            ## 安装 / Install

            需要 Apple Silicon（M 系列芯片）的 Mac，macOS 15 及以上。Intel Mac 暂不支持。
            Requires a Mac with Apple Silicon (M-series) and macOS 15 or later. Intel Macs are not supported yet.

            1. 下载 `.dmg`，把 FleetingGleam 拖进“应用程序”。 / Download the `.dmg` and drag FleetingGleam into Applications.
            2. 这个版本没有经过苹果公证。第一次打开前，在“终端”里执行一次： / This build is not notarised by Apple. Before opening it for the first time, run this once in Terminal:

               ```
               xattr -cr /Applications/FleetingGleam.app
               ```

            **安卓 / Android**：下载 `FleetingGleam-android.apk`，在手机上打开安装。需要 Android 12 及以上的 64 位 ARM 手机；安装时按提示允许浏览器安装应用。 / Download `FleetingGleam-android.apk` and open it on the phone. Needs Android 12 or later on a 64-bit ARM phone; allow your browser to install apps when asked.

            照片只在你自己的设备上处理；应用只为下载模型、连接你自己设置的 NAS 或备份才联网。 / Your photos stay on your own devices; the app only goes online to download models and to reach a NAS or backup you set up yourself.

            更新内容 / What's new: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          # 先作为草稿，维护者检查安装包后再手动发布
          releaseDraft: true
          # 没有自动更新功能：不生成 .app.tar.gz 与 latest.json，Release 里只有 .dmg，用户不会下错
          includeUpdaterJson: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 安卓：和 CI 一样交叉编译核心库、Gradle 出 release 包，但用正式密钥签名（密钥在仓库的 Secrets 里，见 docs/RELEASING.md），
  # 这样它能覆盖安装手机上已有的正式版。和 Mac 包并行编；打标签时由下面的 android-upload 放进 Release。
  android:
    name: Android
    runs-on: ubuntu-latest
    # 核心库按 release（LTO）交叉编译，再 R8 压缩，冷缓存要二三十分钟
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode 是提交数：浅克隆数不对，Gradle 会拒绝构建
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: android
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: 选 NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      # 正式签名：密钥库以 base64 存在 Secret 里，还原到临时目录；路径与密码用 ORG_GRADLE_PROJECT_* 交给 Gradle（等同 -P，见 app/build.gradle.kts）。
      # 没配齐就直接失败：用调试密钥签出来的包装不上已有的正式版，不能放进 Release。
      - name: 还原签名密钥
        env:
          FG_KEYSTORE_BASE64: ${{ secrets.FG_KEYSTORE_BASE64 }}
          FG_KEYSTORE_PASSWORD: ${{ secrets.FG_KEYSTORE_PASSWORD }}
          FG_KEY_ALIAS: ${{ secrets.FG_KEY_ALIAS }}
          FG_KEY_PASSWORD: ${{ secrets.FG_KEY_PASSWORD }}
        run: |
          for name in FG_KEYSTORE_BASE64 FG_KEYSTORE_PASSWORD FG_KEY_ALIAS FG_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::仓库 Secrets 里缺 $name：安卓包没法用正式密钥签名。配置方法见 docs/RELEASING.md 的“Android 安装包”。"
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$FG_KEYSTORE_BASE64" | base64 -d > "$ks"
          {
            echo "ORG_GRADLE_PROJECT_FG_KEYSTORE=$ks"
            echo "ORG_GRADLE_PROJECT_FG_KEYSTORE_PASSWORD=$FG_KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_FG_KEY_ALIAS=$FG_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_FG_KEY_PASSWORD=$FG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Gradle 编译（正式签名）
        run: apps/android/gradlew -p apps/android assembleRelease --no-daemon --stacktrace

      # 确认真的是正式密钥签的：证书指纹必须是这把（公开信息，和手机上已装的正式版是同一把；换密钥时一起改）
      - name: 核对签名并改名
        env:
          EXPECTED_CERT_SHA256: 0d258392c804f6fabd4a3af10b84b9738ba3f6427c10e4e0f10541b5a57e141b
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          certs=$("$signer" verify --print-certs "$apk" 2>&1)
          echo "$certs"
          if ! printf '%s' "$certs" | tr -d ' :' | tr 'A-F' 'a-f' | grep -q "$EXPECTED_CERT_SHA256"; then
            echo "::error::安装包的签名证书不是正式密钥（SHA-256 应为 $EXPECTED_CERT_SHA256），不能放进 Release。"
            exit 1
          fi
          cp "$apk" FleetingGleam-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FleetingGleam-android
          path: FleetingGleam-android.apk
          retention-days: 7

  # 打标签时：等 Mac 任务建好草稿 Release，再把安卓包以固定文件名放进去（落地页的“下载安卓版”指向 releases/latest/download/FleetingGleam-android.apk）
  android-upload:
    name: 安卓包放进 Release
    needs: [macos, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FleetingGleam-android
      - name: 上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" FleetingGleam-android.apk --clobber --repo "$GITHUB_REPOSITORY"
