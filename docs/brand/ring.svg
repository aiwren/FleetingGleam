<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#181c38"/><stop offset="0.7" stop-color="#0c0f20"/><stop offset="1" stop-color="#060710"/></radialGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="512" y1="900" x2="760" y2="200">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.08"/><stop offset="0.5" stop-color="#ffb547" stop-opacity="0.6"/><stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff6dc" stop-opacity="1"/><stop offset="0.3" stop-color="#ffc466" stop-opacity="0.55"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 一圈几乎看不见的轮廓 -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#ffb547" stroke-opacity="0.08" stroke-width="10"/>
  <!-- 被光点燃的那段弧，从底部逆时针到右上 -->
  <path d="M 512 812 A 300 300 0 0 0 724 300" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 512 812 A 300 300 0 0 0 724 300" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round" filter="url(#soft)" opacity="0.6"/>
  <!-- 光点 -->
  <circle cx="724" cy="300" r="140" fill="url(#glow)"/>
  <circle cx="724" cy="300" r="24" fill="#fff8e6"/>
</svg>
