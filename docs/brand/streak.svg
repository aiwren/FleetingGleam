<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="62%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1c2140"/><stop offset="0.6" stop-color="#0e1124"/><stop offset="1" stop-color="#070812"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffb547" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff2cf" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff6dc" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffc466" stop-opacity="0.5"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 远处的尘光 -->
  <g fill="#ffd27a">
    <circle cx="214" cy="268" r="4" opacity="0.35"/><circle cx="790" cy="760" r="5" opacity="0.28"/><circle cx="300" cy="820" r="3" opacity="0.3"/>
    <circle cx="860" cy="210" r="3" opacity="0.22"/><circle cx="640" cy="880" r="3.5" opacity="0.25"/><circle cx="150" cy="560" r="3" opacity="0.2"/>
  </g>
  <!-- 光痕的雾晕 -->
  <path d="M236 790 C 420 680, 560 560, 672 362 L 700 374 C 590 585, 440 710, 246 804 Z" fill="#ffb547" opacity="0.35" filter="url(#haze)"/>
  <!-- 光痕 -->
  <path d="M232 792 C 420 676, 566 548, 676 356 C 684 352, 692 356, 690 366 C 596 572, 450 708, 242 800 C 236 802, 230 798, 232 792 Z" fill="url(#trail)"/>
  <path d="M232 792 C 420 676, 566 548, 676 356 C 684 352, 692 356, 690 366 C 596 572, 450 708, 242 800 C 236 802, 230 798, 232 792 Z" fill="url(#trail)" filter="url(#soft)" opacity="0.8"/>
  <!-- 光头 -->
  <circle cx="686" cy="358" r="150" fill="url(#glow)"/>
  <circle cx="686" cy="358" r="26" fill="#fff8e6"/>
  <circle cx="686" cy="358" r="40" fill="#fff8e6" opacity="0.5" filter="url(#soft)"/>
</svg>
