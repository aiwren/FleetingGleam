<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2044"/><stop offset="1" stop-color="#07080f"/></linearGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="300" y1="760" x2="720" y2="300"><stop offset="0" stop-color="#ffb547" stop-opacity="0.15"/><stop offset="0.6" stop-color="#ffb547"/><stop offset="1" stop-color="#fff1cf"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff6dc"/><stop offset="0.3" stop-color="#ffc466" stop-opacity="0.5"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
